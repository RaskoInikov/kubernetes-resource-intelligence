apiVersion: v1
kind: Namespace
metadata:
  name: kri-monitoring
  labels:
    app.kubernetes.io/part-of: kubernetes-resource-intelligence
    app.kubernetes.io/managed-by: kri-monitoring
    kri.io/disposable: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kri-prometheus
  namespace: kri-monitoring
  labels:
    app.kubernetes.io/part-of: kubernetes-resource-intelligence
    app.kubernetes.io/managed-by: kri-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kri-prometheus-node-metrics-reader
  labels:
    app.kubernetes.io/part-of: kubernetes-resource-intelligence
    app.kubernetes.io/managed-by: kri-monitoring
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kri-prometheus-node-metrics-reader
  labels:
    app.kubernetes.io/part-of: kubernetes-resource-intelligence
    app.kubernetes.io/managed-by: kri-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kri-prometheus-node-metrics-reader
subjects:
  - kind: ServiceAccount
    name: kri-prometheus
    namespace: kri-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kri-prometheus-pod-discovery
  namespace: payments
  labels:
    app.kubernetes.io/part-of: kubernetes-resource-intelligence
    app.kubernetes.io/managed-by: kri-monitoring
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kri-prometheus-pod-discovery
  namespace: payments
  labels:
    app.kubernetes.io/part-of: kubernetes-resource-intelligence
    app.kubernetes.io/managed-by: kri-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kri-prometheus-pod-discovery
subjects:
  - kind: ServiceAccount
    name: kri-prometheus
    namespace: kri-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kri-prometheus-config
  namespace: kri-monitoring
  labels:
    app.kubernetes.io/part-of: kubernetes-resource-intelligence
    app.kubernetes.io/managed-by: kri-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        kri_environment: disposable-kind
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: kubernetes-cadvisor
        honor_timestamps: false
        scheme: https
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: "container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|cpu_cfs_throttled_seconds_total|memory_working_set_bytes)"
      - job_name: kri-workload
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [payments]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: kri-workload
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: container
            replacement: application
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: "kri_http_(requests_total|request_errors_total|request_duration_seconds_bucket|request_duration_seconds_sum|request_duration_seconds_count)"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kri-prometheus
  namespace: kri-monitoring
  labels:
    app.kubernetes.io/name: kri-prometheus
    app.kubernetes.io/part-of: kubernetes-resource-intelligence
    app.kubernetes.io/managed-by: kri-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kri-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kri-prometheus
        app.kubernetes.io/part-of: kubernetes-resource-intelligence
        app.kubernetes.io/managed-by: kri-monitoring
    spec:
      serviceAccountName: kri-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus@sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.listen-address=0.0.0.0:9090
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: kri-prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kri-prometheus
  namespace: kri-monitoring
  labels:
    app.kubernetes.io/name: kri-prometheus
    app.kubernetes.io/part-of: kubernetes-resource-intelligence
    app.kubernetes.io/managed-by: kri-monitoring
spec:
  selector:
    app.kubernetes.io/name: kri-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
