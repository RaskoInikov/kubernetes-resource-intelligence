[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-resource-intelligence"
version = "0.1.0"
description = "Evidence-grounded Kubernetes resource analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Kubernetes Resource Intelligence contributors" }]
dependencies = [
    "fastapi>=0.115,<0.117",
    "fastembed>=0.7,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.34,<0.36",
]

[project.scripts]
kri-api = "kri.api:run"
kri-workload = "kri.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pyyaml>=6,<7",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<0.16",
    "types-pyyaml>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kri = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kri"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
